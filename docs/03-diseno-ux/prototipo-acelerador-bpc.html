<title>Prototipo Acelerador BPC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap">
<style>
/* Layout: barra de control del prototipo arriba (pantalla, estado, arquitectura) y debajo un marco con la app simulada a ancho completo */
:root {
  --bg: #eef1f6; --fg: #182231; --muted: #526072; --line: #cfd7e3; --surface: #ffffff;
  --accent: #144E8C; --accent-fg: #ffffff; --chip: #e3eaf4; --chip-fg: #1d3a5f;
  --font: "Ubuntu", "Segoe UI", system-ui, sans-serif; --mono: "Ubuntu Mono", Consolas, monospace;
  /* app simulada: siempre clara, como el producto */
  --a-bg: #F4F6F9; --a-fg: #1B2533; --a-muted: #4A5568; --a-line: #D9DFE8; --a-line2: #E7EBF1; --a-surface: #ffffff;
  --a-blue: #144E8C; --a-blue-d: #0E3A69; --a-blue-l: #E3ECF7; --a-blue-xl: #F7F9FC; --a-head: #365F91; --a-yellow: #F2B707;
  --a-ok: #17603D; --a-ok-bg: #E3F2EA; --a-ok-i: #1E7B4F; --a-warn: #7A5300; --a-warn-bg: #FDF3D6; --a-err: #9B1C14; --a-err-bg: #FBE4E2; --a-err-i: #B3261E; --a-err-line: #E8A49E;
  --a-sk: #E4E8EE; --a-xl-green: #1D6F42; --a-xl-grid: #E1E4E8; --a-xl-head: #F3F4F6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161e; --fg: #e4e9f1; --muted: #9aa6b8; --line: #2c3645; --surface: #19202b;
  --accent: #7fb0ec; --accent-fg: #0d1a2b; --chip: #233044; --chip-fg: #cfe0f6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161e; --fg: #e4e9f1; --muted: #9aa6b8; --line: #2c3645; --surface: #19202b;
  --accent: #7fb0ec; --accent-fg: #0d1a2b; --chip: #233044; --chip-fg: #cfe0f6; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.top p { margin: 0; color: var(--muted); font-size: 14px; }
.ctl { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.ctl-lbl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; min-width: 92px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 34px; }
.chip:hover { background: var(--chip); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
.chip .c { font-family: var(--mono); font-weight: 700; margin-right: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 500; }
.meta .rf { font-family: var(--mono); }
:focus-visible { outline: 3px solid #F2B707; outline-offset: 2px; }
.frame { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--a-bg); color: var(--a-fg); min-width: 0; box-shadow: 0 6px 24px rgba(10, 30, 60, .10); }

/* ---- App simulada ---- */
.a { font-family: var(--font); color: var(--a-fg); background: var(--a-bg); min-height: 760px; display: flex; flex-direction: column; font-size: 15px; }
.a a { color: var(--a-blue); } .a a:hover { color: var(--a-blue-d); }
.a-hdr { background: var(--a-blue); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 22px; }
.a-logo { color: #fff !important; text-decoration: none; font-weight: 700; font-size: 19px; letter-spacing: .5px; background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }
.a-logo span { color: var(--a-yellow); }
.a-sub { font-size: 14px; color: #D6E2F2; }
.a-hdr-r { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.a-hdr-r .lnk { color: #fff !important; font-size: 14px; background: none; border: 0; font-family: inherit; cursor: pointer; text-decoration: underline; padding: 0; }
.a-badge { background: var(--a-yellow); color: #1B2533; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 999px; }
.a-body { display: flex; flex-wrap: wrap; flex: 1; }
.a-nav { flex: 1 1 230px; background: var(--a-surface); border-right: 1px solid var(--a-line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; }
.a-nav h2 { margin: 0 8px 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--a-muted); font-weight: 500; }
.step { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 44px; box-sizing: border-box; border-radius: 6px; color: var(--a-fg); font: inherit; font-size: 14px; background: none; border: 0; text-align: left; cursor: pointer; width: 100%; }
.step:hover { background: #EEF2F8; }
.step[aria-current="step"] { background: var(--a-blue-l); color: var(--a-blue); font-weight: 700; }
.step .t { flex: 1; } .step .s { font-size: 12px; font-weight: 400; color: var(--a-muted); }
.step .s.ok { color: var(--a-ok); } .step .s.err { color: var(--a-err); }
.a-main { flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box; }
.a-main.solo { max-width: 1200px; margin: 0 auto; width: 100%; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.ph h2 { margin: 0; font-size: 26px; color: var(--a-head); text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--a-muted); max-width: 70ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 500; text-decoration: none; cursor: pointer; box-sizing: border-box; white-space: nowrap; }
.btn-p { background: var(--a-blue); color: #fff; border: 1px solid var(--a-blue); } .btn-p:hover { background: var(--a-blue-d); }
.btn-s { background: #fff; color: var(--a-blue); border: 1px solid #9FB3CC; } .btn-s:hover { background: #EEF2F8; }
.btn:disabled { background: #E4E8EE; color: #5F6B7C; border-color: #E4E8EE; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.card { background: var(--a-surface); border: 1px solid var(--a-line); border-radius: 8px; padding: 20px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 17px; color: var(--a-head); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
.fld input, .fld select, .a select { font: inherit; font-weight: 400; min-height: 44px; padding: 0 12px; border: 1px solid #B8C3D3; border-radius: 6px; background: #fff; color: var(--a-fg); box-sizing: border-box; }
.fld .hint { font-weight: 400; font-size: 13px; color: var(--a-muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.ok { background: var(--a-ok-bg); color: var(--a-ok); } .warn { background: var(--a-warn-bg); color: var(--a-warn); }
.err { background: var(--a-err-bg); color: var(--a-err); } .neu { background: #EEF2F8; color: #2C4A70; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; font-size: 14px; background: var(--a-blue-xl); border: 1px solid var(--a-line); }
.note.w { background: var(--a-warn-bg); border-color: #EBD290; color: #4D3600; }
.note.e { background: var(--a-err-bg); border-color: var(--a-err-line); color: #5C1A14; }
.rn { font-family: var(--mono); font-size: 13px; color: var(--a-muted); }
.tblw { overflow-x: auto; background: var(--a-surface); border: 1px solid var(--a-line); border-radius: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 500; color: var(--a-muted); background: var(--a-blue-xl); padding: 10px 12px; border-bottom: 1px solid var(--a-line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--a-line2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.a .chip { background: #fff; border-color: var(--a-line); color: var(--a-fg); }
.a .chip:hover { background: #EEF2F8; }
.a .chip[aria-pressed="true"] { background: var(--a-blue); border-color: var(--a-blue); color: #fff; }
.sk { background: var(--a-sk); border-radius: 4px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .sk, .spin { animation: none !important; } }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }
.empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 52px 24px; text-align: center; }
.empty p { margin: 0; } .empty .big { font-size: 17px; font-weight: 500; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--a-line); }
.tab { font: inherit; font-size: 14px; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--a-muted); min-height: 44px; }
.tab[aria-selected="true"] { color: var(--a-blue); border-bottom-color: var(--a-blue); font-weight: 700; }
.mod { display: flex; flex-direction: column; gap: 10px; cursor: pointer; border: 2px solid var(--a-line); }
.mod[data-on="1"] { border-color: var(--a-blue); background: #FBFCFE; }
.mod input { width: 22px; height: 22px; accent-color: var(--a-blue); }
.chk { width: 20px; height: 20px; accent-color: var(--a-blue); }
.drop { border: 2px dashed #9FB3CC; border-radius: 8px; padding: 26px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; background: #FBFCFE; }
.sec { border: 1px solid var(--a-line); border-radius: 8px; background: var(--a-surface); }
.sec summary { cursor: pointer; padding: 14px 18px; font-weight: 700; color: var(--a-head); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 44px; box-sizing: border-box; }
.sec .in { padding: 0 18px 16px; display: grid; gap: 8px; }
.li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--a-line2); font-size: 14px; }
.tl { display: flex; flex-direction: column; gap: 0; }
.tl-i { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--a-line2); }
.tl-i:first-child { border-top: 0; }
.dlg { position: relative; max-width: 520px; box-shadow: 0 10px 32px rgba(20, 78, 140, .2); border-color: #9FB3CC; display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: #1B2533; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 10; max-width: calc(100% - 32px); }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.split > .l { flex: 1 1 280px; min-width: 0; } .split > .r { flex: 3 1 480px; min-width: 0; }
.rub { display: flex; justify-content: space-between; gap: 8px; width: 100%; font: inherit; font-size: 14px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 10px; cursor: pointer; min-height: 44px; color: var(--a-fg); }
.rub[aria-pressed="true"] { background: var(--a-blue-l); color: var(--a-blue); font-weight: 700; }
/* Excel simulado */
.xl { background: #fff; display: flex; flex-direction: column; min-height: 760px; font-family: "Segoe UI", var(--font); }
.xl-title { background: var(--a-xl-green); color: #fff; padding: 8px 16px; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.xl-tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--a-xl-head); border-bottom: 1px solid var(--a-xl-grid); padding: 0 8px; }
.xl-tabs span { padding: 8px 12px; font-size: 13px; color: #3c4450; }
.xl-tabs span.on { background: #fff; color: var(--a-xl-green); font-weight: 700; border: 1px solid var(--a-xl-grid); border-bottom-color: #fff; margin-bottom: -1px; }
.xl-rib { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--a-xl-grid); }
.xl-btn { font: inherit; font-size: 13px; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 12px; min-height: 44px; border: 1px solid transparent; background: none; border-radius: 4px; cursor: pointer; color: #1f2a37; }
.xl-btn:hover { background: #EEF2F8; border-color: #D9DFE8; }
.xl-btn:disabled { color: #8a93a0; cursor: not-allowed; background: none; }
.xl-sep { width: 1px; align-self: stretch; background: var(--a-xl-grid); margin: 0 6px; }
.xl-con { margin-left: auto; font-size: 13px; color: var(--a-ok); display: inline-flex; gap: 6px; align-items: center; }
.xl-gridw { overflow: auto; flex: 1; }
.xl-grid { border-collapse: collapse; font-size: 13px; min-width: 760px; }
.xl-grid th { background: var(--a-xl-head); color: #5b6370; font-weight: 400; border: 1px solid var(--a-xl-grid); padding: 2px 8px; text-align: center; min-width: 32px; }
.xl-grid td { border: 1px solid var(--a-xl-grid); padding: 5px 10px; height: 22px; white-space: nowrap; }
.xl-grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
.xl-grid tr.h td { background: var(--a-blue); color: #fff; font-weight: 700; }
.xl-grid tr.tot td { font-weight: 700; background: #F1F5FA; }
.xl-grid td.p { background: #FFF8E1; }
.xl-grid td.p select { min-height: 30px; padding: 0 6px; font-size: 13px; border-color: #c9b26a; }
.xl-grid td.ed { background: #FFFBEA; padding: 0; }
.xl-grid td.ed input { width: 84px; border: 0; background: transparent; font: inherit; text-align: right; padding: 5px 8px; font-variant-numeric: tabular-nums; }
.xl-grid td.ed.bad { background: var(--a-err-bg); outline: 2px solid var(--a-err-i); outline-offset: -2px; }
.xl-sheets { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 8px; background: var(--a-xl-head); border-top: 1px solid var(--a-xl-grid); }
.xl-sheets button { font: inherit; font-size: 13px; padding: 8px 14px; border: 0; background: none; cursor: pointer; color: #3c4450; min-height: 40px; }
.xl-sheets button[aria-pressed="true"] { background: #fff; color: var(--a-xl-green); font-weight: 700; border-bottom: 3px solid var(--a-xl-green); }
.xl-msg { margin: 12px; }
@media (max-width: 640px) {
  .a-main { padding: 20px 16px 32px; }
  .a-nav { border-right: 0; border-bottom: 1px solid var(--a-line); }
  .tbl.cards thead { display: none; }
  .tbl.cards tr { display: block; border-bottom: 1px solid var(--a-line); padding: 6px 0; }
  .tbl.cards td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 6px 12px; }
  .tbl.cards td::before { content: attr(data-l); color: var(--a-muted); font-weight: 500; }
  .ph h2 { font-size: 22px; }
}
</style>

<div class="wrap">
  <div class="top">
    <h1>Prototipo · Acelerador de consolidación SAP BW/BPC</h1>
    <p>12 pantallas del brief de diseño F4. Datos de ejemplo.</p>
  </div>
  <div class="ctl" role="group" aria-label="Controles del prototipo">
    <div class="ctl-row"><span class="ctl-lbl" id="l-scr">Pantalla</span><div class="chips" id="c-scr" role="group" aria-labelledby="l-scr"></div></div>
    <div class="ctl-row">
      <span class="ctl-lbl" id="l-est">Estado</span><div class="chips" id="c-est" role="group" aria-labelledby="l-est"></div>
      <span class="ctl-lbl" id="l-arq">Arquitectura</span><div class="chips" id="c-arq" role="group" aria-labelledby="l-arq"></div>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="frame" id="frame"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
const SCREENS = [
  ['UX-01', 'Clientes', 'Consultor implementador', 'RF-01, RF-04'],
  ['UX-02', 'Conexiones', 'Consultor implementador', 'RF-01, RF-02, RF-04'],
  ['UX-03', 'Diagnóstico e inventario', 'Consultor implementador', 'RF-03, RF-04, RF-09'],
  ['UX-04', 'Módulos', 'Consultor implementador', 'RF-05, RF-23, RF-24, RF-25'],
  ['UX-05', 'Sociedades del grupo', 'Consultor implementador', 'RF-06, RF-13'],
  ['UX-06', 'Mapeo de cuentas', 'Consultor implementador', 'RF-07'],
  ['UX-07', 'Carga de sociedades no SAP', 'Consultor implementador', 'RF-15'],
  ['UX-08', 'Plan de generación', 'Consultor implementador', 'RF-08, RF-09, RF-10, RF-16, RF-18, RF-23, RF-24, RF-25, RF-26'],
  ['UX-09', 'Ejecución y registro', 'Consultor implementador', 'RF-08, RF-10, RF-11, RF-12, RF-13, RF-14, RF-16, RF-17, RF-18, RF-19, RF-23, RF-24, RF-25, RF-26'],
  ['UX-10', 'Reportes', 'Consultor implementador', 'RF-20, RF-27, RF-29'],
  ['UX-11', 'Plantilla de reporte EPM', 'Usuario financiero', 'RF-20, RF-21, RF-22, RF-27'],
  ['UX-12', 'Captura de presupuesto', 'Usuario financiero', 'RF-28']
];
const STEPS = [['UX-02','Conexiones'],['UX-03','Diagnóstico'],['UX-04','Módulos'],['UX-05','Sociedades'],['UX-06','Mapeo de cuentas'],['UX-07','Sociedades no SAP'],['UX-08','Plan de generación'],['UX-09','Ejecución'],['UX-10','Reportes']];
const ESTADOS = [['normal','Normal'],['vacio','Vacío'],['carga','Carga'],['error','Error']];
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const fmt = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 1 });

const CAP0 = [
  ['51050501', 'Sueldos', 'CC100 Administración', 'adm', 182],
  ['51350501', 'Servicios públicos', 'CC100 Administración', 'adm', 24],
  ['51400501', 'Gastos legales', 'CC200 Finanzas', 'adm', 9],
  ['52050501', 'Sueldos de ventas', 'CC300 Ventas', 'ven', 136]
];
const S = {
  screen: 'UX-01', estado: 'normal', arch: 'A', dlg: false, cred: false, tab: 0, confirm: false,
  mods: { cons: true, pres: true, af: true, det: true }, rubro: 0, filtro: 'Todos', sheet: 'R07', busy: false,
  rep: { soc: '1000', fil: 'Sí', mon: 'Moneda local', per: 'Sep-2026' },
  pend: { soc: '1000', fil: 'Sí', mon: 'Moneda local', per: 'Sep-2026' },
  cap: CAP0.map(r => MESES.map((m, i) => String(r[4] + (i % 3) * 2))), capBad: {}, saved: null
};
try { const h = (location.hash || '').slice(1); if (SCREENS.some(s => s[0] === h)) S.screen = h; } catch (e) {}

const $ = id => document.getElementById(id);
const ic = {
  ok: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#1E7B4F"/><path d="M6 10.5l2.5 2.5L14 7.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cur: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#144E8C" stroke-width="2"/><circle cx="10" cy="10" r="4" fill="#144E8C"/></svg>',

    rows += row(n++, `<td><b>Periodo</b></td><td class="p">${sel('per', [['Sep-2026','Sep-2026'],['Ago-2026','Ago-2026']])}</td>`);
    rows += row(n++, '');
    if (e === 'vacio') rows += row(n++, `<td colspan="4" style="color:#5b6370">Sin datos para la sociedad y el periodo elegidos.</td>`);
    else if (e === 'error') rows += row(n++, `<td colspan="5" style="color:var(--a-err);font-weight:700">No se pudo conectar a BPC; revisa la conexión de EPM y presiona Actualizar.</td>`);
    else {
      rows += `<tr class="h"><th scope="row">${n++}</th><td>Rubro</td><td>Descripción</td>${socs.map(s => `<td style="text-align:right">${s}</td>`).join('')}${socs.length > 1 ? '<td style="text-align:right">Total</td>' : ''}</tr>`;
      const tot = socs.map(() => 0); let gt = 0;
      R07.forEach(r => {
        const vs = socs.map(s => val(r[2], s)); vs.forEach((v, i) => tot[i] += v); const t = vs.reduce((a, b) => a + b, 0); gt += t;
        rows += row(n++, `<td class="mono" title="Cuentas mapeadas: ${r[0].replace('F-00-101-0', '1105050').slice(0, 8)}…">${r[0]}</td><td>${r[1]}</td>${vs.map(v => `<td class="n">${S.busy || e === 'carga' ? '…' : fmt.format(v)}</td>`).join('')}${socs.length > 1 ? `<td class="n">${S.busy || e === 'carga' ? '…' : fmt.format(t)}</td>` : ''}`);
      });
      rows += `<tr class="tot"><th scope="row">${n++}</th><td class="mono">F-00-101</td><td>Efectivo y equivalentes de efectivo</td>${tot.map(v => `<td class="n">${S.busy || e === 'carga' ? '…' : fmt.format(v)}</td>`).join('')}${socs.length > 1 ? `<td class="n">${S.busy || e === 'carga' ? '…' : fmt.format(gt)}</td>` : ''}</tr>`;
      rows += row(n++, '');
      rows += row(n++, `<td colspan="4" style="color:#5b6370">${usd ? 'Valores en USD con tasa de cierre de ejemplo 4.100 COP/USD (RN-11). ' : 'Valores en moneda local (COP). '}Cada valor es la suma de las cuentas mapeadas al rubro (RN-10).</td>`);
    }
  } else {
    const adm = sumRows('adm'), ven = sumRows('ven');
    const P = [['Ingresos operacionales', 4200, 3980], ['Costo de ventas', 2310, 2264], ['Gastos de administración', adm, 2100], ['Gastos de ventas', ven, 1580], ['Utilidad operacional', 4200 - 2310 - adm - ven, 3980 - 2264 - 2100 - 1580]];
    rows += row(n++, `<td colspan="3" style="font-weight:700;font-size:15px;color:#144E8C">P01 Presupuesto frente a ejecución · Estado de resultados</td>`);
    rows += row(n++, `<td colspan="3" style="color:#5b6370">Sociedad 1000 Matriz · Presupuesto 2027 v1 · millones de COP · Fuente: Modelo de presupuesto BPC</td>`);
    rows += row(n++, '');
    rows += `<tr class="h"><th scope="row">${n++}</th><td>Concepto</td><td style="text-align:right">Presupuesto</td><td style="text-align:right">Ejecución</td><td style="text-align:right">Variación</td><td style="text-align:right">% ejecución</td></tr>`;
    P.forEach((r, i) => { rows += `<tr class="${i === 4 ? 'tot' : ''}"><th scope="row">${n++}</th><td>${r[0]}</td><td class="n">${fmt.format(r[1])}</td><td class="n">${fmt.format(r[2])}</td><td class="n">${fmt.format(r[2] - r[1])}</td><td class="n">${r[1] ? fmt2.format(r[2] / r[1] * 100) + ' %' : '—'}</td></tr>`; });
    rows += row(n++, '');
    rows += row(n++, `<td colspan="4" style="color:#5b6370">${S.saved ? 'Incluye el presupuesto guardado en el formulario P05 (' + S.saved + ').' : 'Gastos de administración y de ventas salen del formulario P05.'} Datos de ejemplo.</td>`);
  }
  const head = `<tr><th></th>${letters.map(l => `<th>${l}</th>`).join('')}</tr>`;
  const sheets = `<div class="xl-sheets" role="group" aria-label="Hojas">${[['R07','R07 Efectivo'],['P01','P01 Presupuesto vs ejecución']].map(s => `<button type="button" aria-pressed="${S.sheet === s[0]}" data-act="sheet" data-s="${s[0]}">${s[1]}</button>`).join('')}</div>`;
  return xlFrame(S.sheet === 'R07' ? 'R07_Efectivo_y_equivalentes.xlsx' : 'P01_Presupuesto_vs_ejecucion.xlsx', ribbon, `<table class="xl-grid">${head}${rows}</table>`, sheets);
}
function sumRows(k) { let t = 0; CAP0.forEach((r, i) => { if (r[3] === k) S.cap[i].forEach(v => { const x = Number(String(v).replace(/\./g, '').replace(',', '.')); if (!isNaN(x)) t += x; }); }); return t; }

function ux12() {
  const e = S.estado;
  const ribbon = `<button class="xl-btn" type="button" data-act="toast" data-msg="Sesión EPM activa">Iniciar sesión</button><span class="xl-sep"></span>
    <button class="xl-btn" type="button" data-act="toast" data-msg="Datos actualizados desde BPC">${ic.ref}Actualizar</button>
    <button class="xl-btn" type="button" data-act="save" style="color:#144E8C;font-weight:700">${e === 'carga' ? '<span class="spin"></span>' : ic.save}${e === 'carga' ? 'Guardando…' : 'Guardar datos'}</button><span class="xl-sep"></span>
    <span class="xl-con">● Conectado a BPC · Presupuesto</span>`;
  const vac = e === 'vacio';
  const bad = e === 'error' ? { '0-3': 1, '2-7': 1 } : S.capBad;
  let rows = '', n = 1;
  const pad = (c) => c;
  rows += `<tr><th scope="row">${n++}</th><td colspan="6" style="font-weight:700;font-size:15px;color:#144E8C">P05 Captura y ajuste de presupuesto</td><td colspan="10"></td></tr>`;
  rows += `<tr><th scope="row">${n++}</th><td><b>Sociedad</b></td><td class="p" colspan="2"><select aria-label="Sociedad"><option>1000 Matriz</option><option>2000 Filial Colombia</option></select></td><td><b>Versión</b></td><td class="p" colspan="2"><select aria-label="Versión"><option>Presupuesto 2027 v1</option></select></td><td><b>Año</b></td><td class="p"><select aria-label="Año"><option>2027</option></select></td><td colspan="8"></td></tr>`;
  rows += `<tr><th scope="row">${n++}</th><td colspan="16" style="color:#5b6370">${vac ? 'Sin presupuesto para esta versión: ingresa los valores.' : 'Millones de COP. Celdas amarillas editables; los totales no se editan. Se guarda en el modelo de planeación de BPC (RN-08).'}</td></tr>`;
  rows += `<tr class="h"><th scope="row">${n++}</th><td>Cuenta</td><td>Descripción</td><td>Centro de costo</td>${MESES.map(m => `<td style="text-align:right">${m}</td>`).join('')}<td style="text-align:right">Total</td></tr>`;
  const colT = MESES.map(() => 0); let gt = 0;
  CAP0.forEach((r, i) => {
    let rt = 0;
    const cells = MESES.map((m, j) => {
      const raw = vac ? '' : S.cap[i][j]; const x = Number(raw); if (!isNaN(x) && raw !== '') { rt += x; colT[j] += x; }
      const b = bad[i + '-' + j];
      return `<td class="ed ${b ? 'bad' : ''}"><input aria-label="${r[1]} ${m}" inputmode="decimal" value="${raw}" data-act="cap" data-i="${i}" data-j="${j}" ${b ? 'aria-invalid="true"' : ''}></td>`;
    }).join('');
    gt += rt;
    rows += `<tr><th scope="row">${n++}</th><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td>${cells}<td class="n"><b>${fmt.format(rt)}</b></td></tr>`;
  });
  rows += `<tr class="tot"><th scope="row">${n++}</th><td colspan="3">Total</td>${colT.map(v => `<td class="n">${fmt.format(v)}</td>`).join('')}<td class="n">${fmt.format(gt)}</td></tr>`;
  const head = `<tr><th></th>${'ABCDEFGHIJKLMNOP'.split('').map(l => `<th>${l}</th>`).join('')}</tr>`;
  const msg = e === 'error' ? `<div class="note e xl-msg" role="alert">${ic.err}<div><b>No se guardaron 2 celdas.</b> Solo se aceptan números. Revisa las celdas marcadas en rojo.</div></div>` : Object.keys(S.capBad).length ? `<div class="note e xl-msg" role="alert">${ic.err}<div>Solo se aceptan números en las celdas marcadas.</div></div>` : '';
  return xlFrame('P05_Captura_presupuesto_2027.xlsx', ribbon, msg + `<table class="xl-grid">${head}${rows}</table>`, `<div class="xl-sheets"><button type="button" aria-pressed="true">P05 Captura</button><button type="button" data-go="UX-11" data-sheet="P01">P01 Presupuesto vs ejecución</button></div>`);
}

const RENDER = { 'UX-01': ux01, 'UX-02': ux02, 'UX-03': ux03, 'UX-04': ux04, 'UX-05': ux05, 'UX-06': ux06, 'UX-07': ux07, 'UX-08': ux08, 'UX-09': ux09, 'UX-10': ux10, 'UX-11': ux11, 'UX-12': ux12 };

function controls() {
  $('c-scr').innerHTML = SCREENS.map(s => `<button class="chip" type="button" aria-pressed="${S.screen === s[0]}" data-scr="${s[0]}"><span class="c">${s[0]}</span>${s[1]}</button>`).join('');
  $('c-est').innerHTML = ESTADOS.map(s => `<button class="chip" type="button" aria-pressed="${S.estado === s[0]}" data-est="${s[0]}">${s[1]}</button>`).join('');
  $('c-arq').innerHTML = [['A','A · separada'],['B','B · integrada']].map(s => `<button class="chip" type="button" aria-pressed="${S.arch === s[0]}" data-arq="${s[0]}">${s[1]}</button>`).join('');
  const m = SCREENS.find(s => s[0] === S.screen);
  $('meta').innerHTML = `<span><b>${m[0]} ${m[1]}</b></span><span>Usuario: <b>${m[2]}</b></span><span>Soporta: <span class="rf">${m[3]}</span></span>${S.screen === 'UX-11' ? '<span>Estructura común a los reportes; R07 y P01 como modelo.</span>' : ''}`;
}
function render(focus) {
  controls();
  $('frame').innerHTML = RENDER[S.screen]();
  if (focus) { const h = $('frame').querySelector('h2, .xl-title'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
}
let tt;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }
function go(scr, extra, keep) {
  S.screen = scr; S.dlg = false; S.confirm = false; S.capBad = {};
  if (extra && extra.est) S.estado = extra.est; else if (!keep) S.estado = 'normal';
  if (extra && extra.sheet) S.sheet = extra.sheet;
  try { history.replaceState(null, '', '#' + scr); } catch (e) {}
  render(true);
  try { $('frame').scrollIntoView({ block: 'nearest' }); } catch (e) {}
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-scr],[data-est],[data-arq],[data-go],[data-act]');
  if (!t) return;
  if (t.dataset.scr) { go(t.dataset.scr, null, true); return; }
  if (t.dataset.est && !t.dataset.go) { S.estado = t.dataset.est; render(); return; }
  if (t.dataset.arq) { S.arch = t.dataset.arq; render(); return; }
  if (t.dataset.go) { ev.preventDefault(); go(t.dataset.go, { est: t.dataset.est, sheet: t.dataset.sheet }); return; }
  const a = t.dataset.act;
  if (a === 'dlg1') { S.dlg = true; render(); }
  else if (a === 'dlg0') { S.dlg = false; render(); }
  else if (a === 'conf1') { S.confirm = true; render(); }
  else if (a === 'conf0') { S.confirm = false; render(); }
  else if (a === 'cred') { S.cred = !S.cred; render(); }
  else if (a === 'tab') { S.tab = Number(t.dataset.i); render(); }
  else if (a === 'rub') { S.rubro = Number(t.dataset.i); render(); }
  else if (a === 'filtro') { S.filtro = t.dataset.f; render(); }
  else if (a === 'sheet') { S.sheet = t.dataset.s; render(); }
  else if (a === 'toast') { toast(t.dataset.msg); }
  else if (a === 'refresh') {
    if (S.estado !== 'normal') { toast('Cambia el estado a Normal para actualizar.'); return; }
    S.busy = true; render();
    setTimeout(() => { S.rep = Object.assign({}, S.pend); S.busy = false; render(); toast('Datos actualizados desde BPC'); }, 700);
  }
  else if (a === 'save') {
    const bad = {};
    S.cap.forEach((r, i) => r.forEach((v, j) => { if (v !== '' && isNaN(Number(v))) bad[i + '-' + j] = 1; }));
    S.capBad = bad;
    if (Object.keys(bad).length) { render(); return; }
    S.saved = '16-Oct-26 ' + new Date().toTimeString().slice(0, 5); render();
    toast('Presupuesto guardado en el modelo de planeación de BPC');
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'mod') { S.mods[t.dataset.k] = t.checked; render(); }
  else if (t.dataset.act === 'par') { S.pend[t.dataset.k] = t.value; toast('Parámetro cambiado: presiona Actualizar'); }
  else if (t.dataset.act === 'cap') { S.cap[t.dataset.i][t.dataset.j] = t.value.trim(); delete S.capBad[t.dataset.i + '-' + t.dataset.j]; render(); }
});

render(false);
})();
</script>
